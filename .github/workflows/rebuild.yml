name: Rebuild channel

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-channel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Extract corresponding plugin source
        run: python -m zipfile -e source.zip .build
      - name: Build and test plugins
        working-directory: .build/Still-plugin-source
        run: cargo test --locked --workspace
      - name: Build portable packages
        run: python .build/Still-plugin-source/scripts/package_plugins.py --output .
      - name: Commit packages and catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add org.wallpaper.* catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update plugin packages and channel catalog'
          git push
